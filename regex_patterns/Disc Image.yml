name: Disc Image
pattern: (?i)\b(DVD9|DVD5|BD25|BD50|BD100)\b|\bISO\b
description: Matches disc-image release titles, including ISO and named DVD or Blu-ray disc sizes.
tags:
- Disc
- Rejection
